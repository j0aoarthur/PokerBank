# ============================================================
# Perfil: prod (producao — Fly.io + Neon PostgreSQL)
# Banco de dados: PostgreSQL via Neon (SSL obrigatorio)
# Flyway: habilitado (aplica migrations no startup)
# ============================================================

# Database - PostgreSQL Neon com SSL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool - ajustado para Neon serverless
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway - roda as migrations no startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Log - minimo em producao
logging.level.root=WARN
logging.level.com.j0aoarthur.pokerbank=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %c{1} : %msg%n

# Servidor
server.address=0.0.0.0
