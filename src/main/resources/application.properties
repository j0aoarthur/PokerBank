# Application properties for PokerBank
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring configuration
spring.application.name=PokerBank
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Timezone configuration
spring.jackson.time-zone=America/Sao_Paulo

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

# Spring Mail Properties
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:username}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}

# Enable STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT configuration
jwt.secret.password=${JWT_SECRET_PASSWORD:defaultSecret}
jwt.expiration=${JWT_EXPIRATION_TIME:1440}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_TIME:7}

# Documentation configuration
springdoc.swagger-ui.path=/documentation

spring.flyway.enabled=false
