# ============================================================
# Perfil: dev (desenvolvimento local)
# Banco de dados: PostgreSQL via variáveis de ambiente (.env)
# Flyway: habilitado (aplica migrations automaticamente)
# ============================================================

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway - roda as migrations no startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Log
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level [%t] %c{1} : %msg%n

# Servidor
server.address=0.0.0.0
