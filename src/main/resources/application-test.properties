# ============================================================
# Perfil: test (execucao local sem PostgreSQL - banco H2 em memoria)
# Banco de dados: H2 in-memory (nao precisa de Postgres rodando)
# Flyway: desabilitado (o Hibernate cria o schema automaticamente)
# ============================================================

# Database - H2 in-memory
spring.datasource.url=jdbc:h2:mem:pokerbank_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect explicito para o Hibernate nao depender de metadata JDBC
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA - cria e derruba schema a cada execucao
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway - desabilitado (H2 nao tem as migrations de Postgres)
spring.flyway.enabled=false

# Log
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%t] [%X{sessionId}] %c{1.} : %msg%n

# Servidor
server.address=0.0.0.0
