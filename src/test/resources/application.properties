# Application properties for PokerBank
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}
app.baseurl=${APP_BASEURL:http://localhost:${server.port:8080}${server.servlet.context-path:/api}}


# Database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Spring configuration
spring.application.name=PokerBank

# Timezone configuration
spring.jackson.time-zone=America/Sao_Paulo

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Spring Mail Properties
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:username}
spring.mail.password=${SPRING_MAIL_PASSWORD:password}

# Enable STARTTLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT configuration
jwt.secret.password=${JWT_SECRET_PASSWORD:07de23cfa56f12a882b3e79002ca81d9fde93b05fe586549cfeddc9ccedcac844}
jwt.expiration=${JWT_EXPIRATION_TIME:1440}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_TIME:7}

# Documentation configuration
springdoc.swagger-ui.path=/documentation

spring.flyway.enabled=false
frontend.base-url=http://localhost:3000
