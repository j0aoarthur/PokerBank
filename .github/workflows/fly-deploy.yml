# Deploy para Fly.io ao fazer push na branch main
# Documentação: https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Secrets necessários no GitHub (Settings > Secrets > Actions):
#   - FLY_API_TOKEN  →  obtido com: flyctl auth token

name: Deploy → Fly.io

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes
        run: mvn test -q

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy para Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
